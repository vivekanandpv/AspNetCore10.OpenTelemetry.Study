# SigNoz self-hosted stack, mirroring the manifests generated by SigNoz's
# official Foundry installer (https://signoz.io/docs/install/docker/) so the
# architecture matches the currently recommended deployment. The old
# `signoz/signoz-standalone` all-in-one image is deprecated and no longer
# maintained by SigNoz; this replaces it with the supported multi-container
# stack: ClickHouse Keeper, ClickHouse, a Postgres metastore, the SigNoz
# backend/UI, and the SigNoz OTel Collector ("ingester") that the app sends
# OTLP data to. `signoz-bootstrap` auto-creates the admin org SigNoz requires
# before the ingester will accept data, so `docker compose up` works
# unattended on a fresh clone with no manual UI signup step.
name: signoz

networks:
  signoz-network:
    name: signoz-network

services:
  signoz-telemetrykeeper-clickhousekeeper-0:
    container_name: signoz-telemetrykeeper-clickhousekeeper-0
    image: clickhouse/clickhouse-keeper:25.12.5
    entrypoint:
      - /usr/bin/clickhouse-keeper
      - --config-file=/etc/clickhouse-keeper/keeper.yaml
    networks:
      - signoz-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-keeper-client",
          "-h",
          "localhost",
          "-p",
          "9181",
          "-q",
          "ls",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - signoz-telemetrykeeper-0-data:/var/lib/clickhouse-keeper
      - ./signoz/telemetrykeeper/keeper-0.yaml:/etc/clickhouse-keeper/keeper.yaml:ro

  signoz-telemetrystore-clickhouse-user-scripts:
    container_name: signoz-telemetrystore-clickhouse-user-scripts
    image: clickhouse/clickhouse-server:25.12.5
    command:
      - bash
      - -c
      - |-
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    networks:
      - signoz-network
    restart: on-failure
    volumes:
      - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts

  signoz-telemetrystore-clickhouse-0-0:
    container_name: signoz-telemetrystore-clickhouse-0-0
    image: clickhouse/clickhouse-server:25.12.5
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLICKHOUSE_CONFIG=/etc/clickhouse-server/config-0-0.yaml
    depends_on:
      signoz-telemetrykeeper-clickhousekeeper-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-user-scripts:
        condition: service_completed_successfully
    networks:
      - signoz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - signoz-telemetrystore-0-0-data:/var/lib/clickhouse
      - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts:ro
      - ./signoz/telemetrystore/config-0-0.yaml:/etc/clickhouse-server/config-0-0.yaml:ro
      - ./signoz/telemetrystore/functions.yaml:/etc/clickhouse-server/functions.yaml:ro

  signoz-telemetrystore-migrator:
    container_name: signoz-telemetrystore-migrator
    image: signoz/signoz-otel-collector:latest
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate ready &&
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    depends_on:
      signoz-telemetrystore-clickhouse-0-0:
        condition: service_healthy
    networks:
      - signoz-network
    restart: on-failure

  signoz-metastore-postgres-0:
    container_name: signoz-metastore-postgres-0
    image: postgres:16
    environment:
      - POSTGRES_DB=signoz
      - POSTGRES_USER=signoz
      - POSTGRES_PASSWORD=signoz
    networks:
      - signoz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signoz -d signoz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - signoz-metastore-postgres-0-data:/var/lib/postgresql/data

  signoz-signoz-0:
    container_name: signoz-signoz-0
    image: signoz/signoz:latest
    environment:
      - SIGNOZ_SQLSTORE_PROVIDER=postgres
      - SIGNOZ_SQLSTORE_POSTGRES_DSN=postgres://signoz:signoz@signoz-metastore-postgres-0:5432/signoz?sslmode=disable
      - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
    depends_on:
      signoz-metastore-postgres-0:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    networks:
      - signoz-network
    ports:
      - "8080:8080" # SigNoz UI
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # SigNoz won't manage/start the ingester's OTLP receivers until an org
  # exists (self-hosted SigNoz always requires one admin org — this isn't
  # something that can be turned off). Rather than requiring a manual
  # first-run signup in the UI, this creates it automatically on every
  # `docker compose up`, with fixed local-dev-only credentials so the stack
  # works identically on any machine straight after cloning. It no-ops (400)
  # once the org already exists, so it's safe to run on every startup.
  # Change the password via the UI (http://localhost:8080) if this ever runs
  # anywhere other than your own machine.
  signoz-bootstrap:
    container_name: signoz-bootstrap
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        code=$$(curl -s -o /dev/null -w '%{http_code}' -X POST http://signoz-signoz-0:8080/api/v1/register \
          -H 'Content-Type: application/json' \
          -d '{"name":"Admin","orgDisplayName":"Local Dev","email":"user@company.com","password":"Password123!"}')
        if [ "$$code" = "200" ] || [ "$$code" = "400" ]; then
          echo "SigNoz org ready (HTTP $$code)"
          exit 0
        fi
        echo "Unexpected response from SigNoz register endpoint: HTTP $$code"
        exit 1
    depends_on:
      signoz-signoz-0:
        condition: service_healthy
    networks:
      - signoz-network
    restart: "no"

  ingester:
    container_name: signoz-ingester
    image: signoz/signoz-otel-collector:latest
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/opamp-config.yaml --copy-path=/var/tmp/collector-config.yaml
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    depends_on:
      signoz-telemetrystore-clickhouse-0-0:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
      signoz-signoz-0:
        condition: service_healthy
      signoz-bootstrap:
        condition: service_completed_successfully
    networks:
      signoz-network:
        aliases:
          - signoz-ingester
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    restart: unless-stopped
    volumes:
      - ./signoz/ingester/ingester.yaml:/etc/otel-collector-config.yaml:ro
      - ./signoz/ingester/opamp.yaml:/etc/opamp-config.yaml:ro

volumes:
  signoz-telemetrykeeper-0-data:
  signoz-telemetrystore-0-0-data:
  signoz-telemetrystore-user-scripts:
  signoz-metastore-postgres-0-data:
