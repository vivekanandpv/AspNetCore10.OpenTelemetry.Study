# Grafana LGTM-style observability stack: the app sends OTLP to otel-collector,
# which (after memory_limiter/redaction/tail_sampling) fans traces out to Tempo,
# logs to Loki, and metrics to Prometheus. Tempo's metrics-generator turns
# ingested traces into span/service-graph metrics remote-written into
# Prometheus, which is how trace<->metrics correlation works in Grafana.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    mem_limit: 512m
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo API/UI, used by Grafana
    # Tempo's own OTLP receiver ports (4317/4318) are intentionally not
    # published to the host — only otel-collector's are, so the app always
    # talks to the collector, never straight to Tempo.
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
